{% extends 'base.html' %}
{% block title %}Login — RoomLagbe{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="bg-white rounded-4 p-4 shadow-sm">
                <h3 class="fw-bold text-center mb-1">স্বাগতম!</h3>
                <p class="text-muted text-center small mb-4">আপনার অ্যাকাউন্টে Login করুন</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100">Login</button>
                </form>
                <p class="text-center mt-3 small text-muted">
                    অ্যাকাউন্ট নেই?
                    <a href="{% url 'register' %}" style="color:var(--primary);">Register করুন</a> |
                    <a href="{% url 'register_host' %}" style="color:var(--primary);">Host হন</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
